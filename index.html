<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>承运提现日报 · 云端看板</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="gate" class="gate">
  <div class="gate-box">
    <h2>🔒 承运提现看板</h2>
    <p class="meta">请输入访问口令</p>
    <input type="password" id="gatePwd" placeholder="访问口令" autocomplete="off" />
    <button id="gateBtn" class="btn">进入</button>
    <p id="gateErr" class="gate-err"></p>
  </div>
</div>
<div id="app">
<header class="topbar">
  <div>
    <h1>承运提现日报 · 云端看板</h1>
    <p class="sub">在家 / 公司任意浏览器可查看 · 数据内置版（2026-07-31 快照）</p>
  </div>
  <span id="genTime" class="muted"></span>
  <button id="lockBtn" class="lock-btn" title="锁定 / 退出">🔒 锁定</button>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="report">今日日报</button>
  <button class="tab" data-tab="history">历史记录</button>
  <button class="tab" data-tab="predict">预测</button>
  <button class="tab" data-tab="coefficient">系数</button>
  <button class="tab" data-tab="forecast">预测 vs 真实</button>
  <button class="tab" data-tab="config">配置</button>
</nav>

<main>
  <section id="tab-report" class="panel active"></section>
  <section id="tab-history" class="panel"></section>
  <section id="tab-predict" class="panel"></section>
  <section id="tab-coefficient" class="panel"></section>
  <section id="tab-forecast" class="panel"></section>
  <section id="tab-config" class="panel"></section>
</main>

<div id="status" class="status">加载中…</div>
</div><!-- /#app -->

<script src="app.js"></script>
</body>
</html>
