name: 承运提现 - 早间同步(09:00 北京时间)

on:
  schedule:
    - cron: "0 1 * * 1-5"   # UTC 01:00 = 北京时间 09:00，工作日
  workflow_dispatch:        # 允许手动触发测试

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖 + Chromium
        working-directory: fetch
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 抓取并同步到 GitHub 仓库
        working-directory: fetch
        env:
          CW_USER: ${{ secrets.CW_USER }}
          CW_PASS: ${{ secrets.CW_PASS }}
          CW_CHANNEL: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python run_cloud.py morning
